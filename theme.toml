# Save or replace this file beside config.toml to apply a theme.
# Omitted roles use the built-in colors for the selected mode.
mode = "dark" # dark or light

[palette]
primary = "#DE916D"                    # cursor, active indicators, keywords
secondary = "#ADBE91"                  # strings
tertiary = "#DEB883"                   # literals and types
outline = "#9C978C"                    # comments
primary_container = "#55453B"          # selection background
secondary_container = "#34332F"        # active tab background
on_secondary_container = "#F3E9D7"     # active tab text
surface = "#222322"                    # editor background
on_surface = "#E8DFCE"                 # standard text
on_surface_variant = "#B7AEA1"         # inactive tab text
surface_container_lowest = "#1C1D1C"   # terminal background
surface_container_low = "#2A2B29"      # current line
surface_container = "#292927"          # tab bar
surface_container_high = "#292927"     # status bar
surface_container_highest = "#2E2D2B"  # windows and popups
# error = "#F28B82"                    # error text
