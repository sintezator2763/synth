[package]
name = "synth"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.25.1"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
interprocess = "2.4.9"
notify = "8.2"
serde_json = "1"
shell-words = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
lto = "thin"
strip = true
