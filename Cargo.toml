[package]
name = "synth"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.25.1"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
interprocess = "2.4.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
