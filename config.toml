# Save this file to apply changes. The shell and its arguments apply to the next terminal session.

[editor]
theme = "dark" # dark, light
font_size = 16.0

[interface]
enable_tabs = false
enable_line_numbers = false
enable_syntax_highlighting = false
enable_status_bar = false
tab_height = 36.0
tab_max_chars = 28
tab_font_size = 12.0
tab_min_width = 96.0
editor_padding = 18

[colors.dark]
editor_background = "#111318"
foreground = "#D6DCE8"
selection = "#373F50"
muted_surface = "#1B1E25"
terminal_background = "#171B22"
tabs_background = "#1B1E25"
active_tab_background = "#292D36"
tab_text_active = "#D6DCE8"
tab_text_inactive = "#A6AFBE"
status_background = "#20252E"
window_dot_red = "#F0898E"
window_dot_yellow = "#EFC66A"
window_dot_green = "#83CCB0"

[colors.light]
editor_background = "#F6F9FD"
foreground = "#1C2B3D"
selection = "#B3D6F7"
muted_surface = "#EAEFF6"
terminal_background = "#EAF1F9"
tabs_background = "#E6EBF3"
active_tab_background = "#FFFFFF"
tab_text_active = "#1C2B3D"
tab_text_inactive = "#5C6776"
status_background = "#EAEFF6"
window_dot_red = "#F0898E"
window_dot_yellow = "#EFC66A"
window_dot_green = "#83CCB0"

[terminal]
side = "right" # right, left
width_fraction = 0.44 # fraction of the window, from 0.15 to 0.85
font_size = 14.0
# shell = "pwsh" # omit for the platform default
args = [] # arguments for a custom shell
# toggle_key = "Esc" # legacy shortcut, used when [keybindings] is absent
# animation_ms = 180 # legacy duration, used when [animations.terminal] is absent

[keybindings]
Esc = "synth terminal toggle"
# "Ctrl+Alt+F" = "synth focus toggle"
# "Ctrl+S" = "synth save"
# "Ctrl+N" = "synth new"
# "Ctrl+PageDown" = "synth tab next"
# "Ctrl+PageUp" = "synth tab prev"
# "Ctrl+Shift+R" = "synth config reload"

# Panel animations. Cursor trails are controlled independently below.
# direction: in, out, in_out, out_in
# style: linear, sine, quadratic, cubic, quartic, quintic, exponential, circular, back, elastic, bounce
# Older configs may use easing in place of direction.

[animations]
enabled = false

[animations.terminal]
open_ms = 180
close_ms = 140
direction = "out"
style = "cubic"

[animations.tabs]
duration_ms = 120
direction = "out"
style = "quadratic"

[animations.line_numbers]
duration_ms = 120
direction = "out"
style = "quadratic"

[animations.status_bar]
duration_ms = 100
direction = "out"
style = "linear"

[cursor_trail]
target = "none" # none, editor, terminal, both
delay_ms = 65 # how long the cursor must stay still before a move can leave a trail
decay_seconds = [0.10, 0.40] # fade times for short and long jumps
start_threshold_cells = [2.0, 2.0] # minimum move in columns or rows
color = "auto" # cursor color, or a hex color such as "#77BFFF"
opacity = 0.62 # 0 to 1
width_scale = 1.0
appearance = "glow" # glow, ribbon, solid
direction = "out"
style = "cubic"
