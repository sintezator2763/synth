# Save this file to apply changes. The shell and its arguments apply to the next terminal session.

# To import a theme, replace theme.toml beside this file.

[editor]
font_size = 16.0
tab_size = 4
insert_spaces = false # insert a tab character when false
auto_indent = false # carry leading whitespace onto the next line
# formatter = "rustfmt --emit stdout" # reads and writes UTF-8 via stdin/stdout
wrap_lines = true # wrap to the editor width, false enables horizontal scrolling
recover_unsaved_documents = true # keep local drafts of unsaved edits and offer recovery after a crash

[interface]
show_tabs = true
show_line_numbers = true
show_line_number_divider = true
syntax_highlighting = true
show_status_bar = true
status_bar_height = 26.0
status_bar_font_size = 12.0
show_file_icons = false
enable_search_and_replace = false # enable the search and replace bar (Ctrl+F)
show_external_file_changes = true # show a reload prompt when the active file changes on disk
tab_height = 36.0
tab_max_chars = 28
tab_font_size = 12.0
tab_min_width = 96.0
editor_padding = 18

[terminal]
side = "right" # right, left
width_fraction = 0.32 # fraction of the window, from 0.15 to 0.85
command_target = "window" # window or shared, applies to the next terminal session
font_size = 14.0
# shell = "pwsh" # omit for the platform default
args = [] # arguments for a custom shell
# toggle_key = "Esc" # legacy shortcut, used when [keybinds] is absent
# animation_ms = 180 # legacy duration, used when [animations.terminal] is absent

# Run synth help for built-in commands. Other strings run in /bin/sh or Windows cmd.exe.
# Commands run in the active file's directory, or Synth's startup directory for untitled files.
# Shell commands run in the background. Redirect output to a file to see it.
# Use shell: to run a pipeline or script that starts with synth.
# Example for Linux: "Ctrl+F8" = "printf '%s\\n' hello > shortcut.log"
# Example for Windows: "Ctrl+F8" = "echo hello > shortcut.log"
[keybinds]
"Ctrl+F" = "synth search toggle"
# For a list, the first action available in the current view wins.
Esc = ["synth dialog cancel", "synth search close", "synth terminal toggle-edit"]
Enter = "synth search next" # only while the search field has focus
"Ctrl+Shift+C" = "synth terminal copy" # only while the terminal has focus
"Shift+Esc" = "synth terminal hide" # hide the panel even when the terminal has focus
# Scale terminal text when it has focus, otherwise scale the whole interface.
"Ctrl+Equals" = ["synth terminal zoom in", "synth zoom in"]
"Ctrl+Plus" = ["synth terminal zoom in", "synth zoom in"]
"Ctrl+Shift+Plus" = ["synth terminal zoom in", "synth zoom in"]
"Ctrl+Minus" = ["synth terminal zoom out", "synth zoom out"]
"Ctrl+0" = ["synth terminal zoom reset", "synth zoom reset"]
# "Ctrl+Alt+F" = "synth focus toggle"
# "Ctrl+S" = "synth save"
# "Ctrl+Shift+S" = "synth saveall"
# "Alt+Right" = "synth split right"
# "Alt+Down" = "synth split down"
# "Ctrl+F6" = "synth split focus next"
# "Ctrl+CloseBracket" = "synth indent"
# "Ctrl+OpenBracket" = "synth unindent"
# "Ctrl+N" = "synth new"
# "Ctrl+PageDown" = "synth tab next"
# "Ctrl+PageUp" = "synth tab prev"
# "Ctrl+Shift+R" = "synth config reload"
# "Ctrl+Alt+W" = "synth wrap toggle" # switch wrapping for the active tab
# "Ctrl+Alt+S" = "synth search toggle" # an alternative shortcut for the search bar

# Panel animations. Cursor trails are controlled independently below.
# direction: in, out, in_out, out_in
# style: linear, sine, quadratic, cubic, quartic, quintic, exponential, circular, back, elastic, bounce
# Older configs may use easing in place of direction.

[animations]
enabled = false

[animations.terminal]
open_ms = 180
close_ms = 140
direction = "out"
style = "cubic"

[animations.tabs]
duration_ms = 120
direction = "out"
style = "quadratic"

[animations.line_numbers]
duration_ms = 120
direction = "out"
style = "quadratic"

[animations.status_bar]
duration_ms = 100
direction = "out"
style = "linear"

[cursor_trail]
target = "none" # none, editor, terminal, both
delay_ms = 65 # how long the cursor must stay still before a move can leave a trail
decay_seconds = [0.10, 0.40] # fade times for short and long jumps
start_threshold_cells = [2.0, 2.0] # minimum move in columns or rows
color = "auto" # cursor color, or a hex color such as "#77BFFF"
opacity = 0.62 # 0 to 1
width_scale = 1.0
appearance = "glow" # glow, ribbon, solid
direction = "out"
style = "cubic"
