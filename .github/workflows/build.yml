name: Build Synth

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Delete older build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prune-artifacts.py --apply

  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: python
        run: |
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              base_version = tomllib.load(manifest)["package"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if not tag.startswith("v"):
                  raise SystemExit("Release tags must start with v")
              version = tag[1:]
          else:
              series = base_version.rsplit(".", 1)[0]
              version = f'{series}.{os.environ["GITHUB_RUN_NUMBER"]}'
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Expected a numeric major.minor.patch version")
          if any(int(part) > 65535 for part in version.split(".")):
              raise SystemExit("Version components must fit in a Windows executable version")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"number={version}", file=output)

  build:
    needs: [version, cleanup]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            targets: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows
            targets: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      SYNTH_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libxkbcommon-dev
      - run: cargo test --locked
      - name: Build Windows EXE
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist
          $output = "dist/Synth-${env:SYNTH_VERSION}-windows-x64-portable.exe"
          Copy-Item target/x86_64-pc-windows-msvc/release/synth.exe $output
          $version = (Get-Item $output).VersionInfo
          if ($version.FileVersion -ne $env:SYNTH_VERSION -or $version.ProductVersion -ne $env:SYNTH_VERSION) {
            throw "Unexpected EXE version. File: $($version.FileVersion), product: $($version.ProductVersion)"
          }
      - name: Verify maximized Windows startup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class SynthWindow {
              [StructLayout(LayoutKind.Sequential)]
              public struct Rect { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr window, out Rect bounds);
              [DllImport("user32.dll")]
              public static extern bool IsZoomed(IntPtr window);
          }
          '@
          $directory = Join-Path $env:RUNNER_TEMP "synth-window-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $executable = Join-Path $directory synth.exe
          Copy-Item "dist/Synth-${env:SYNTH_VERSION}-windows-x64-portable.exe" $executable
          $archive = Join-Path $directory mesa.7z
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.3.0/mesa3d-26.3.0-release-msvc.7z" -OutFile $archive
          $expected = "C505FCC77E8F63A09D7DDAC086591D2F542C0698D37FC9E3094685A34D0D9991"
          if ((Get-FileHash -Path $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "Unexpected Mesa archive checksum"
          }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          & $sevenZip e $archive "-o$directory" "x64/opengl32.dll" "x64/libgallium_wgl.dll" "x64/libEGL.dll" "x64/libGLESv2.dll" -y
          if ($LASTEXITCODE -ne 0) {
            throw "Could not extract the test renderer"
          }
          $env:GALLIUM_DRIVER = "llvmpipe"
          $stderr = Join-Path $directory synth-stderr.log
          $process = Start-Process -FilePath $executable -WorkingDirectory $directory -RedirectStandardError $stderr -PassThru
          try {
            $verified = $false
            for ($i = 0; $i -lt 50; $i++) {
              $process.Refresh()
              if ($process.HasExited) {
                Get-Content $stderr
                throw "Synth exited during startup with code $($process.ExitCode)"
              }
              $handle = $process.MainWindowHandle
              if ($handle -ne [IntPtr]::Zero -and [SynthWindow]::IsZoomed($handle)) {
                $bounds = [SynthWindow+Rect]::new()
                if ([SynthWindow]::GetWindowRect($handle, [ref]$bounds)) {
                  $work = [System.Windows.Forms.Screen]::FromHandle($handle).WorkingArea
                  $edges = @(
                    ($bounds.Left - $work.Left), ($bounds.Right - $work.Right),
                    ($bounds.Top - $work.Top), ($bounds.Bottom - $work.Bottom)
                  )
                  if (@($edges | Where-Object { [Math]::Abs($_) -gt 24 }).Count -eq 0) {
                    $verified = $true
                    break
                  }
                }
              }
              Start-Sleep -Milliseconds 200
            }
            if (-not $verified) {
              throw "Synth did not maximize to the monitor work area"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
            }
          }
      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          bash packaging/macos.sh "$SYNTH_VERSION" "dist/Synth-$SYNTH_VERSION-macos-universal.dmg"
      - name: Build Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          bash packaging/linux.sh target/x86_64-unknown-linux-gnu/release/synth "dist/Synth-$SYNTH_VERSION-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: Synth-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [version, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      SYNTH_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag
        run: |
          ref="refs/tags/v$SYNTH_VERSION"
          remote_tags=$(git ls-remote origin "$ref" "$ref^{}")
          tagged_commit=$(awk '$2 ~ /\^\{\}$/ {peeled=$1} {tag=$1} END {print peeled ? peeled : tag}' <<< "$remote_tags")
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag v$SYNTH_VERSION already points to a different commit."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: Synth-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: Synth v${{ needs.version.outputs.number }}
          body: Automated build.
          generate_release_notes: false
          fail_on_unmatched_files: true
          make_latest: legacy
          files: |
            dist/Synth-${{ needs.version.outputs.number }}-windows-x64-portable.exe
            dist/Synth-${{ needs.version.outputs.number }}-macos-universal.dmg
            dist/Synth-${{ needs.version.outputs.number }}-linux-x86_64.AppImage
